appId: com.sparkii.desktop
productName: Sparkii
copyright: "Copyright © 2026 深圳宇岳向上科技有限公司"
artifactName: "Sparkii-${version}-win-${arch}.${ext}"
directories:
  output: out
files:
  - dist/**
  - dist-electron/**
  - dist-electron/pi-runtime/**
  - package.json
asar: true
extraResources:
  - from: native/windows-sandbox/bin
    to: windows-sandbox
  - from: ../../apps/desktop/agents
    to: agents
  - from: runtime/portable-git.7z.exe
    to: runtime/portable-git.7z.exe
  - from: runtime/document-parse/sparkii-document-parse.7z.exe
    to: runtime/document-parse/sparkii-document-parse.7z.exe
  - from: runtime/document-parse/checksums.json
    to: runtime/document-parse/checksums.json
  - from: runtime/tools/fd.exe
    to: runtime/tools/fd.exe
  - from: runtime/tools/rg.exe
    to: runtime/tools/rg.exe
  - from: runtime/tools/licenses
    to: runtime/tools/licenses
win:
  icon: build/icon.ico
  target:
    - nsis
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
extraMetadata:
  name: sparkii-desktop
  main: dist-electron/main/index.js
