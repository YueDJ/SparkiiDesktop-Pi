appId: com.sparkii.desktop
productName: Sparkii
directories:
  output: out
files:
  - dist/**
  - dist-electron/**
  - dist-electron/pi-runtime/**
  - package.json
asar: true
extraResources:
  - from: ../../profiles
    to: profiles
  - from: runtime/portable-git.7z.exe
    to: runtime/portable-git.7z.exe
win:
  icon: build/icon.ico
  target:
    - nsis
    - appx
appx:
  identityName: com.sparkii.desktop
  applicationId: SparkiiDesktop
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
extraMetadata:
  main: dist-electron/main/index.js
